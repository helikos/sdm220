; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Устройство выбирается окружением, а не #define в configuration.h:
;   pio run -e sdm220      (по умолчанию)
;   pio run -e pzem
; build_src_filter исключает чужой счётчик из сборки - раньше оба
; processing-файла компилировались всегда, независимо от #define.

[platformio]
default_envs = sdm220

[env]
; Платформа запинена: без версии PlatformIO на чистой машине возьмёт 8.0.0
; с ядром Arduino 3.x, где убран esp_event_legacy.h, а значит и все
; SYSTEM_EVENT_* (75 использований в WiFiContext.cpp). 6.1.0 = ядро 2.0.7,
; под которым проект и написан.
platform = espressif32 @ 6.1.0
board = esp32dev
framework = arduino

monitor_speed = 115200

; min_spiffs.csv даёт 1.9 МБ на раздел приложения вместо 1.25 МБ.
; ВНИМАНИЕ: таблица разделов не обновляется по OTA - чтобы она применилась,
; плату нужно один раз прошить по USB. До этого прошивка продолжит работать
; в старом разделе default.csv (она туда влезает).
board_build.partitions = min_spiffs.csv

; Только для src/: включает -Wformat, без которого атрибут
; format(printf) у Logger::log не проверяет формат-строки.
build_src_flags = -Wall -Wextra -Wno-unused-parameter

; Версии запинены точно: диапазоны (^1.0.0 у eModbus, отсутствие версии
; у AsyncMqttClient) приводили к тому, что сборка зависела от того, когда
; в последний раз чистили .pio. В реестре к тому же остались НЕ те версии,
; на которых проект писался: eModbus - только 1.7.4 (serial переехал из
; конструктора ModbusClientRTU в begin()), ESPAsyncWebServer-esphome -
; только 3.x. Код приведён к этим версиям.
; AsyncElegantOTA лежит в lib/: из реестра пакет удалён целиком,
; см. lib/AsyncElegantOTA/WHY_VENDORED.md
; ESPAsyncWebServer-esphome 3.x тянет свой форк AsyncTCP-esphome, а
; AsyncMqttClient - обычный AsyncTCP: оба определяют AsyncClient, и линковка
; падала на multiple definition. Форк API-совместим, оставляем его один.
lib_ignore = AsyncTCP

lib_deps = marvinroger/AsyncMqttClient @ 0.9.0
           bblanchon/ArduinoJson @ 7.4.3
           miq19/eModbus @ 1.7.4
           ottowinter/ESPAsyncWebServer-esphome @ 3.4.1

[env:sdm220]
build_flags = -D DEVICE_SDM220
build_src_filter = +<*> -<processing/PzemProcessing.cpp> -<registers/pzem/>

[env:pzem]
build_flags = -D DEVICE_PZEM
build_src_filter = +<*> -<processing/SDM220Processing.cpp> -<registers/sdm220/>
